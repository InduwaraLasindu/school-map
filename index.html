<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Class Map & Prefect Directory</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --highlight: rgba(56, 189, 248, 0.4);
            --highlight-border: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            width: 350px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            border-color: var(--accent);
        }

        .class-list {
            flex-grow: 1;
            overflow-y: auto;
            border-radius: 8px;
        }

        .class-list::-webkit-scrollbar {
            width: 6px;
        }
        .class-list::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 3px;
        }

        .building-group {
            margin-bottom: 15px;
        }

        .building-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 5px;
        }

        .class-item {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .class-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
            transform: translateX(4px);
        }

        .class-item.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
        }

        .class-name { font-weight: 600; font-size: 0.95rem; }
        .class-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

        /* Main View Area */
        .main-view {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
            position: relative;
        }

        .info-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: none; /* Hidden until selection */
            animation: fadeIn 0.4s ease;
        }

        .info-panel h2 { font-size: 1.8rem; margin-bottom: 10px; }
        .info-badges { display: flex; gap: 10px; }
        .badge {
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .map-wrapper {
            position: relative;
            background: #fff; /* White bg for images */
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: none; /* Hidden until selection */
            align-self: flex-start; /* Keep image natural size */
            max-width: 100%;
        }

        .map-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        /* The dynamic highlight box */
        #highlightBox {
            position: absolute;
            background-color: var(--highlight);
            border: 3px solid var(--highlight-border);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: none;
            z-index: 20;
        }

        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 1.2rem;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

        const container = document.getElementById('classListContainer');
        
        // Group data by Building -> Floor
        const groupedData = roomData.reduce((acc, room) => {
            if (!acc[room.bldg]) acc[room.bldg] = {};
            if (!acc[room.bldg][room.floor]) acc[room.bldg][room.floor] = [];
            acc[room.bldg][room.floor].push(room);
            return acc;
        }, {});

        function renderList(searchQuery = "") {
            container.innerHTML = "";
            let foundAny = false;

            for (const bldg in groupedData) {
                let bldgHtml = `<div class="building-group"><div class="building-title">${bldg}</div>`;
                let bldgHasItems = false;

                for (const floor in groupedData[bldg]) {
                    const filteredRooms = groupedData[bldg][floor].filter(r => 
                        r.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                        r.floor.toLowerCase().includes(searchQuery.toLowerCase())
                    );

                    if (filteredRooms.length > 0) {
                        bldgHasItems = true;
                        foundAny = true;
                        filteredRooms.forEach(room => {
                            bldgHtml += `
                                <div class="class-item" id="item-${room.id}" onclick="selectRoom('${room.id}')">
                                    <div class="class-name">${room.name}</div>
                                    <div class="class-meta">${room.floor}</div>
                                </div>
                            `;
                        });
                    }
                }
                bldgHtml += `</div>`;
                
                if (bldgHasItems) {
                    container.innerHTML += bldgHtml;
                }
            }

            if (!foundAny) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">No rooms found.</div>`;
            }
        }

        function filterClasses() {
            renderList(document.getElementById('searchInput').value);
        }

        function selectRoom(roomId) {
            // Remove active state
            document.querySelectorAll('.class-item').forEach(el => el.classList.remove('active'));
            // Add active state to clicked
            const activeItem = document.getElementById(`item-${roomId}`);
            if(activeItem) activeItem.classList.add('active');

            const room = roomData.find(r => r.id === roomId);
            if (!room) return;

            // Hide placeholder, show panels
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('infoPanel').style.display = 'block';
            document.getElementById('mapWrapper').style.display = 'inline-block';

            // Populate Info
            document.getElementById('roomTitle').innerText = room.name;
            document.getElementById('roomBuilding').innerText = room.bldg;
            document.getElementById('roomFloor').innerText = room.floor;
            document.getElementById('roomPrefect').innerText = room.pre;

            // Handle Map & Highlight
            const mapImg = document.getElementById('floorImage');
            const highlight = document.getElementById('highlightBox');
            
            // Hide highlight temporarily during image swap
            highlight.style.display = 'none';

            // If it's a new floor, change the image source
            if (!mapImg.src.includes(room.img)) {
                mapImg.src = room.img;
                mapImg.onload = () => drawHighlight(room.rect);
            } else {
                drawHighlight(room.rect);
            }
        }

        function drawHighlight(rect) {
            const highlight = document.getElementById('highlightBox');
            highlight.style.display = 'block';
            // Use percentage coordinates to maintain aspect ratio perfectly
            highlight.style.top = rect.t + '%';
            highlight.style.left = rect.l + '%';
            highlight.style.width = rect.w + '%';
            highlight.style.height = rect.h + '%';
        }

        // Initialize App
        renderList();
