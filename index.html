<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School Navigator Companion</title>
    
    <!-- Favicon (Browser Tab Thumbnail) -->
    <link rel="icon" href="logo.png" type="image/png">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        /* --- Animations --- */
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .view-section {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            animation: fadeSlideIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .view-section.active {
            display: flex;
        }

        /* --- Header & Search --- */
        .header-sticky {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 15px 15px 15px;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .header-title-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .app-logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 6px;
        }

        .header-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-box {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box:focus { border-color: var(--accent); }

        /* --- Top Nav (Back Button) --- */
        .nav-back {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            cursor: pointer;
            padding-bottom: 10px;
        }

        /* --- Scrolling Container --- */
        .scroll-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 40px;
        }
        
        .scroll-container::-webkit-scrollbar { width: 0; }

        /* --- CATEGORY GRID --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .category-card:active {
            transform: scale(0.96);
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
        }

        .cat-icon {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .cat-name {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.3;
        }

        /* --- LIST VIEW (Classes & Search Results) --- */
        .sub-cat-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin: 20px 0 10px 5px;
            font-weight: 700;
        }

        .list-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-card:active {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .list-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .list-meta { font-size: 0.85rem; color: var(--text-muted); }

        /* --- MAP VIEW --- */
        .info-card {
            background: var(--card-bg);
            margin: 0 0 20px 0;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .info-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 15px; }
        
        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .badge {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .image-wrapper {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .image-wrapper img.loaded {
            opacity: 1;
        }

        .spinner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0,0,0,0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- HOME VIEW: Search & Category Grid -->
    <div id="homeView" class="view-section active">
        <div class="header-sticky">
            <div class="header-title-container">
                <img src="logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
                <div class="header-title">School Navigator Companion</div>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="Search for a class or room..." oninput="handleSearch()">
        </div>
        
        <div class="scroll-container">
            <!-- Default Grid -->
            <div id="categoryGrid" class="grid-container"></div>
            <!-- Search Results (Hidden by default) -->
            <div id="searchResults" style="display: none;"></div>
        </div>
    </div>

    <!-- CATEGORY LIST VIEW: Shows classes inside a selected category -->
    <div id="categoryListView" class="view-section">
        <div class="header-sticky">
            <div class="nav-back" onclick="navigate('homeView')">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back
            </div>
            <div class="header-title" id="catListTitle" style="margin-top: 10px;">Category Name</div>
        </div>
        <div class="scroll-container" id="catListContainer"></div>
    </div>

    <!-- MAP VIEW: Shows the actual floor plan -->
    <div id="mapView" class="view-section">
        <div class="header-sticky">
            <div class="nav-back" id="mapBackButton" onclick="goBackFromMap()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back
            </div>
        </div>
        <div class="scroll-container">
            <div class="info-card">
                <div class="info-title" id="roomTitle">Room Name</div>
                <div class="badge-grid">
                    <div class="badge">🏢 <span id="roomBuilding">Building</span></div>
                    <div class="badge">📍 <span id="roomFloor">Level</span></div>
                </div>
            </div>

            <div class="image-wrapper">
                <div id="mapSpinner" class="spinner"></div>
                <img id="floorImage" src="" alt="Floor Plan" onload="imageLoaded()">
            </div>
        </div>
    </div>

        // Specific category order
        const catOrder = [
            "Lower Nursery", "Nursery", "Pre-Grade",
            "Grade 1", "Grade 2", "Grade 3", "Grade 4", "Grade 5", "Grade 6",
            "Grade 7", "Grade 8", "Grade 9", "Grade 10", "Grade 11",
            "Forms (Secondary)", "Advanced Level", "Other"
        ];

        const subCatOrder = ["Administration", "Labs", "Activities", "Services"];

        // State & Grouped Data
        let historyStack = ['homeView'];
        const groupedData = {};
        catOrder.forEach(c => groupedData[c] = { items: [], subcats: {} });
        
        roomData.forEach(room => {
            if (!groupedData[room.cat]) return;
            if (room.cat === "Other" && room.subCat) {
                if (!groupedData[room.cat].subcats[room.subCat]) {
                    groupedData[room.cat].subcats[room.subCat] = [];
                }
                groupedData[room.cat].subcats[room.subCat].push(room);
            } else {
                groupedData[room.cat].items.push(room);
            }
        });

        // Background Preloader for ultra-fast UX
        function preloadImages() {
            setTimeout(() => {
                const loaded = new Set();
                roomData.forEach(room => {
                    if (!loaded.has(room.img)) {
                        const img = new Image();
                        img.src = room.img;
                        loaded.add(room.img);
                    }
                });
            }, 1000); // Delayed start to not block initial UI render
        }

        // Render the Home Grid
        function renderHomeGrid() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = "";
            
            catOrder.forEach(cat => {
                const group = groupedData[cat];
                if (group.items.length > 0 || Object.keys(group.subcats).length > 0) {
                    let shortName = cat.replace("Grade ", "");
                    if(cat === "Forms (Secondary)") shortName = "Forms";
                    if(cat === "Advanced Level") shortName = "A/L";
                    
                    grid.innerHTML += `
                        <div class="category-card" onclick="openCategory('${cat}')">
                            <div class="cat-icon">📚</div>
                            <div class="cat-name">${shortName}</div>
                        </div>
                    `;
                }
            });
        }

        // Search Functionality (Flat List)
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('categoryGrid');
            const results = document.getElementById('searchResults');
            
            if (query.trim() === "") {
                grid.style.display = "grid";
                results.style.display = "none";
                return;
            }

            grid.style.display = "none";
            results.style.display = "block";
            results.innerHTML = "";
            let found = false;

            roomData.forEach(room => {
                if (room.name.toLowerCase().includes(query) || room.cat.toLowerCase().includes(query) || (room.subCat && room.subCat.toLowerCase().includes(query))) {
                    found = true;
                    results.innerHTML += `
                        <div class="list-card" onclick="selectRoom('${room.id}')">
                            <div>
                                <div class="list-name">${room.name}</div>
                                <div class="list-meta">${room.cat} • ${room.bldg}</div>
                            </div>
                            <div style="color: var(--accent);">➔</div>
                        </div>
                    `;
                }
            });

            if (!found) results.innerHTML = `<div class="empty-state">No matching rooms found.</div>`;
        }

        // Open specific category list
        function openCategory(catName) {
            const container = document.getElementById('catListContainer');
            document.getElementById('catListTitle').innerText = catName;
            container.innerHTML = "";
            
            const group = groupedData[catName];
            
            // Direct items
            group.items.forEach(room => {
                container.innerHTML += `
                    <div class="list-card" onclick="selectRoom('${room.id}')">
                        <div>
                            <div class="list-name">${room.name}</div>
                            <div class="list-meta">${room.bldg} • ${room.floor}</div>
                        </div>
                        <div style="color: var(--accent);">➔</div>
                    </div>
                `;
            });

            // Subcategories
            if (catName === "Other") {
                subCatOrder.forEach(sub => {
                    if (group.subcats[sub] && group.subcats[sub].length > 0) {
                        container.innerHTML += `<div class="sub-cat-header">${sub}</div>`;
                        group.subcats[sub].forEach(room => {
                            container.innerHTML += `
                                <div class="list-card" onclick="selectRoom('${room.id}')">
                                    <div>
                                        <div class="list-name">${room.name}</div>
                                        <div class="list-meta">${room.bldg} • ${room.floor}</div>
                                    </div>
                                    <div style="color: var(--accent);">➔</div>
                                </div>
                            `;
                        });
                    }
                });
            }

            navigate('categoryListView');
        }

        function selectRoom(roomId) {
            const room = roomData.find(r => r.id === roomId);
            if (!room) return;

            document.getElementById('roomTitle').innerText = room.name;
            document.getElementById('roomBuilding').innerText = room.bldg;
            document.getElementById('roomFloor').innerText = room.floor;

            const mapImg = document.getElementById('floorImage');
            const spinner = document.getElementById('mapSpinner');
            
            mapImg.classList.remove('loaded');
            spinner.style.display = 'block';
            
            mapImg.src = room.img;
            
            navigate('mapView');
        }

        function imageLoaded() {
            document.getElementById('mapSpinner').style.display = 'none';
            document.getElementById('floorImage').classList.add('loaded');
        }

        // Smooth Navigation Logic
        function navigate(viewId) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            if (viewId !== historyStack[historyStack.length - 1]) {
                historyStack.push(viewId);
            }
            window.scrollTo(0, 0);
        }

        function goBackFromMap() {
            historyStack.pop(); // Remove map view
            const previousView = historyStack[historyStack.length - 1] || 'homeView';
            navigate(previousView);
            historyStack.pop(); // Prevent duplication caused by navigating
        }

        // Initialize App
        renderHomeGrid();
        preloadImages();

    </script>
