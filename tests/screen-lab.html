<body><header><h1>Campus Navigator · Screen lab</h1><p>Real iframe viewports, scaled to fit this screen. This changes the layout’s CSS viewport, without stretching the app.</p><nav id="presets" aria-label="Screen presets"></nav><form id="sizeForm"><label>Width <input id="width" type="number" min="280" max="5000" value="390" required></label><label>Height <input id="height" type="number" min="280" max="3000" value="844" required></label><button>Apply size</button><button type="button" id="report">Check visible layout</button></form><output id="status"></output></header><main><div id="holder"><iframe id="preview" title="Campus navigator test viewport" src="../index.html"></iframe></div></main><pre id="results" aria-live="polite"></pre></body></html>
