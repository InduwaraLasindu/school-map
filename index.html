<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus Mobile Navigator</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- VIEW 1: DIRECTORY LIST --- */
        #listView {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .header-sticky {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 15px 15px 15px;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--accent);
        }

        .search-box {
            width: 100%;
            padding: 14px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .search-box:focus { border-color: var(--accent); }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 40px;
        }

        /* Accordion Styles */
        .category-btn {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            cursor: pointer;
        }
        
        .category-btn:active { background: #2a3b52; }
        
        .chevron {
            transition: transform 0.3s ease;
        }

        .category-content {
            display: none;
            padding-left: 10px;
            margin-bottom: 15px;
            border-left: 2px solid var(--border);
            margin-left: 10px;
        }

        .sub-cat-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            margin: 15px 0 8px 15px;
            font-weight: 700;
        }

        .class-card {
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 14px 15px;
            margin-bottom: 6px;
            margin-left: 10px;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .class-card:active {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent);
        }

        .class-name { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .class-floor { font-size: 0.8rem; color: var(--text-muted); }

        /* Flat Search Results */
        .flat-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
        }
        .flat-card:active { border-color: var(--accent); }

        /* --- VIEW 2: MAP VIEW --- */
        #mapView {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            background-color: var(--bg-dark);
        }

        .nav-back {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            cursor: pointer;
        }

        .info-card {
            background: var(--card-bg);
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .info-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 12px; }
        
        .badge-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }
        
        .badge {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
        }

        .image-wrapper {
            margin: 0 15px 30px 15px;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .loading-text {
            padding: 40px;
            color: #666;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="listView">
        <div class="header-sticky">

            <input type="text" id="searchInput" class="search-box" placeholder="Search for a class or room..." onkeyup="filterClasses()">
        </div>
        <div class="list-container" id="classListContainer">
            <!-- Populated by JS -->
        </div>
    </div>

    <div id="mapView">
        <div class="nav-back" onclick="showListView()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Directory
        </div>

        <div class="info-card">
            <div class="info-title" id="roomTitle">Room Name</div>
            <div class="badge-grid">
                <div class="badge">🏢 <span id="roomBuilding">Building</span></div>
                <div class="badge">📍 <span id="roomFloor">Level</span></div>
                <div class="badge">🛡️ <span id="roomPrefect">Name</span></div>
            </div>
        </div>

        <div class="image-wrapper">
            <div id="loadingIndicator" class="loading-text">Loading map...</div>
            <img id="floorImage" src="" alt="Floor Plan" style="display: none;" onload="imageLoaded()">
        </div>
    </div>

            // MAIN BUILDING - LEVEL 7

            { id: "m7-3", cat: "Other", subCat: "Activities", name: "Auditorium", bldg: "Main Building", floor: "Level 7", pre: "Unassigned", img: "LFP 26-27/Main Building/Level 7/Auditorium_20260905_174219_0000.jpg" },

        ];

        // Specific category order
        const catOrder = [
            "Lower Nursery", "Nursery", "Pre-Grade",
            "Grade 1", "Grade 2", "Grade 3", "Grade 4", "Grade 5", "Grade 6",
            "Grade 7", "Grade 8", "Grade 9", "Grade 10", "Grade 11",
            "Forms (Secondary)", "Advanced Level", "Other"
        ];

        const subCatOrder = ["Administration", "Labs", "Activities", "Services"];

        const container = document.getElementById('classListContainer');
        const listView = document.getElementById('listView');
        const mapView = document.getElementById('mapView');
        const mapImg = document.getElementById('floorImage');
        const loadingIndicator = document.getElementById('loadingIndicator');

        // Group the data by category -> subcat
        const groupedData = {};
        catOrder.forEach(c => groupedData[c] = { items: [], subcats: {} });
        
        roomData.forEach(room => {
            if (!groupedData[room.cat]) groupedData[room.cat] = { items: [], subcats: {} };
            if (room.cat === "Other" && room.subCat) {
                if (!groupedData[room.cat].subcats[room.subCat]) {
                    groupedData[room.cat].subcats[room.subCat] = [];
                }
                groupedData[room.cat].subcats[room.subCat].push(room);
            } else {
                groupedData[room.cat].items.push(room);
            }
        });

        function renderAccordion() {
            container.innerHTML = "";
            
            catOrder.forEach(cat => {
                const group = groupedData[cat];
                const hasItems = group.items.length > 0 || Object.keys(group.subcats).length > 0;
                
                if (hasItems) {
                    let html = `
                        <div class="category-btn" onclick="toggleCat('cat-${cat.replace(/\s+/g, '-')}')">
                            <span>${cat}</span>
                            <svg id="icon-cat-${cat.replace(/\s+/g, '-')}" class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="category-content" id="cat-${cat.replace(/\s+/g, '-')}">
                    `;

                    // Render direct items
                    group.items.forEach(room => {
                        html += `
                            <div class="class-card" onclick="selectRoom('${room.id}')">
                                <div class="class-name">${room.name}</div>
                                <div class="class-floor">${room.bldg} • ${room.floor}</div>
                            </div>
                        `;
                    });

                    // Render Subcategories (for "Other")
                    if (cat === "Other") {
                        subCatOrder.forEach(sub => {
                            if (group.subcats[sub] && group.subcats[sub].length > 0) {
                                html += `<div class="sub-cat-header">${sub}</div>`;
                                group.subcats[sub].forEach(room => {
                                    html += `
                                        <div class="class-card" onclick="selectRoom('${room.id}')">
                                            <div class="class-name">${room.name}</div>
                                            <div class="class-floor">${room.bldg} • ${room.floor}</div>
                                        </div>
                                    `;
                                });
                            }
                        });
                    }

                    html += `</div>`;
                    container.innerHTML += html;
                }
            });
        }

        function toggleCat(catId) {
            const content = document.getElementById(catId);
            const icon = document.getElementById('icon-' + catId);
            if(content.style.display === 'block') {
                content.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.style.display = 'block';
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function filterClasses() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            if (query.trim() === "") {
                renderAccordion();
                return;
            }

            // Flat search UI for quick filtering
            container.innerHTML = "";
            let found = false;

            roomData.forEach(room => {
                if (room.name.toLowerCase().includes(query) || room.cat.toLowerCase().includes(query) || (room.subCat && room.subCat.toLowerCase().includes(query))) {
                    found = true;
                    container.innerHTML += `
                        <div class="flat-card" onclick="selectRoom('${room.id}')">
                            <div class="class-name">${room.name}</div>
                            <div class="class-floor">${room.cat} • ${room.bldg} • ${room.floor}</div>
                        </div>
                    `;
                }
            });

            if (!found) container.innerHTML = `<div style="text-align:center; padding: 30px; color: var(--text-muted);">No rooms found.</div>`;
        }

        function showListView() {
            mapView.style.display = 'none';
            listView.style.display = 'flex';
        }

        function selectRoom(roomId) {
            const room = roomData.find(r => r.id === roomId);
            if (!room) return;

            listView.style.display = 'none';
            mapView.style.display = 'flex';

            document.getElementById('roomTitle').innerText = room.name;
            document.getElementById('roomBuilding').innerText = room.bldg;
            document.getElementById('roomFloor').innerText = room.floor;
            document.getElementById('roomPrefect').innerText = room.pre;

            mapImg.style.display = 'none';
            loadingIndicator.style.display = 'block';
            
            mapImg.src = room.img;
            window.scrollTo(0, 0); 
        }

        function imageLoaded() {
            loadingIndicator.style.display = 'none';
            mapImg.style.display = 'block';
        }

        // Initialize App
        renderAccordion();
    </script>
